name: test
on:
  push:
  pull_request:

jobs:
  pings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start a fake ping endpoint
        run: |
          cat > /tmp/server.py <<'PY'
          import http.server
          class H(http.server.BaseHTTPRequestHandler):
              def handle_one(self):
                  n = int(self.headers.get("Content-Length") or 0)
                  body = self.rfile.read(n).decode() if n else ""
                  with open("/tmp/pings.log", "a") as f:
                      f.write(f"{self.command} {self.path} {body}\n")
                  self.send_response(200); self.end_headers(); self.wfile.write(b"OK")
              do_GET = do_POST = do_HEAD = handle_one
              def log_message(self, *a): pass
          http.server.ThreadingHTTPServer(("127.0.0.1", 8099), H).serve_forever()
          PY
          python3 /tmp/server.py &
          sleep 1
      - uses: ./
        with: { url: "http://127.0.0.1:8099/abc", status: start }
      - uses: ./
        with: { url: "http://127.0.0.1:8099/abc", status: "${{ job.status }}" }
      - uses: ./
        with: { url: "http://127.0.0.1:8099/abc", status: failure, body: "disk full" }
      - uses: ./
        with: { url: "http://127.0.0.1:8099/abc", status: "3" }
      - uses: ./
        with: { ping-key: k1, slug: nightly, base-url: "http://127.0.0.1:8099", create: "true" }
      - name: A failed ping only warns
        uses: ./
        with: { url: "http://127.0.0.1:1/abc" }
      - name: Check what the endpoint got
        run: |
          cat /tmp/pings.log
          diff <(printf '%s\n' "GET /abc/start " "GET /abc " "POST /abc/fail disk full" "GET /abc/3 " "GET /k1/nightly?create=1 ") /tmp/pings.log
